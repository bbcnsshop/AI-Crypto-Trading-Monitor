# backup.conf
# คอนฟิกสำหรับ Backup & Restore LXC

# ========================================
# LXC SETTINGS
# ========================================

# LXC ID ที่ต้องการ backup (หลายตัวคั่นด้วย space)
# ใช้ค่าว่างเพื่อให้พิมพ์ ID ตอนรัน script
LXC_ID=""

# ชื่อ LXC Container
LXC_NAME="odoo"

# ========================================
# BACKUP SETTINGS
# ========================================

# ที่เก็บ backup (ต้องมีพื้นที่เพียงพอ)
BACKUP_DIR="/mnt/backups/odoo-lxc"

# ========================================
# RETENTION POLICY
# ========================================

# รักษา backup ไว้กี่วัน
RETENTION_DAYS=7

# รักษา backup ไว้กี่สัปดาห์
RETENTION_WEEKS=4

# รักษา backup ไว้กี่เดือน
RETENTION_MONTHS=6

# ========================================
# REMOTE BACKUP (OPTIONAL)
# ========================================

# เปิดใช้งาน remote backup (yes/no)
REMOTE_BACKUP="no"

# Remote host (SSH)
REMOTE_HOST="192.168.1.100"

# Remote directory
REMOTE_DIR="/backups/odoo"

# Remote user (default: root)
REMOTE_USER="root"

# SSH port (default: 22)
REMOTE_PORT="22"

# ========================================
# DATABASE SETTINGS
# ========================================

# PostgreSQL
DB_NAME="odoo"
DB_USER="odoo"
DB_HOST="localhost"
DB_PORT="5432"

# ========================================
# NOTIFICATION (OPTIONAL)
# ========================================

# ส่ง notification (yes/no)
SEND_NOTIFICATION="no"

# Webhook URL (Discord, Slack, etc.)
WEBHOOK_URL=""

# Email
EMAIL_TO=""

# ========================================
# ADVANCED SETTINGS
# ========================================

# Compression level (1-9, default: 6)
COMPRESSION_LEVEL=6

# Backup mode: snapshot, suspend, stop
# snapshot = เร็วที่สุด แต่ต้องมีพื้นที่พอสำหรับ snapshot
# suspend = หยุดชั่วคราว แล้ว resume
# stop = หยุด container แล้ว backup (ปลอดภัยที่สุด)
BACKUP_MODE="snapshot"

# Timeout สำหรับ backup (วินาที)
BACKUP_TIMEOUT=3600

# Log level: debug, info, warn, error
LOG_LEVEL="info"